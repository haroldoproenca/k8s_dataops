# Source: debezium-platform/templates/conductor-role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conductor-debeziumservers-creator
rules:
  - apiGroups: ["debezium.io"]
    resources: ["debeziumservers"]
    verbs: ["patch", "create", "delete", "list", "deletecollection"]
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    resourceNames: [ "debezium-platform-offsets" ]
    verbs: [ "create", "update", "patch", "get" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments", "replicasets" ]
    verbs: [ "get", "list"]
  - apiGroups: [ "" ]
    resources: [ "pods", "pods/log", "services" ]
    verbs: [ "get", "list" ]