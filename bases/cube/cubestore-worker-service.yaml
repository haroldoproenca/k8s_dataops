apiVersion: v1
kind: Service
metadata:
  name: cubestore-worker
  labels:
    app: cubestore-worker
spec:
  clusterIP: None  # Headless — expõe DNS por pod: cubestore-worker-{N}.cubestore-worker
  selector:
    app: cubestore-worker
  ports:
    - name: worker
      port: 10001
      targetPort: 10001
      protocol: TCP
