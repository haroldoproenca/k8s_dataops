apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  # Cube API — REST / GraphQL / WebSocket em :4000
  - cube-api-deployment.yaml
  - cube-api-service.yaml
  - cubeapi-pvc.yaml
  # Cube Refresh Worker — pré-agregações em background
  - cube-refresh-worker-deployment.yaml
  # CubeStore Router — metastore + coordenação de queries em :9999
  - cubestore-router-deployment.yaml
  - cubestore-router-service.yaml
  # CubeStore Worker(s) — armazenamento distribuído de pré-agregações em :10001
  - cubestore-worker-statefulset.yaml
  - cubestore-worker-service.yaml
  - cubestore-pvc.yaml
