apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-api
  labels:
    app: cube-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cube-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cube-api
    spec:
      volumes:
        - name: cube-conf
          persistentVolumeClaim:
            claimName: cubeapi-pvc
      containers:
        - name: cube-api
          image: cubejs/cube:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cube-config
            - secretRef:
                name: cube-secrets
          volumeMounts:
            - name: cube-conf
              mountPath: /cube/conf
          livenessProbe:
            httpGet:
              path: /livez
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
