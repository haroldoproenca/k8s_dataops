# Source: superset/templates/secret-superset-config.yaml
apiVersion: v1
kind: Secret
metadata:
  name: superset-config
  namespace: superset
  labels:
    app: superset
    chart: superset-0.15.5
    release: "superset"
    heritage: "Helm"
type: Opaque
stringData:
  superset_config.py: |
    import os
    from flask_caching.backends.rediscache import RedisCache

    # === Metadata Database ===
    DB_USER = os.environ.get("DB_USER", "superset")
    DB_PASS = os.environ.get("DB_PASS", "")
    DB_HOST = os.environ.get("DB_HOST", "localhost")
    DB_PORT = os.environ.get("DB_PORT", "5432")
    DB_NAME = os.environ.get("DB_NAME", "superset")
    SQLALCHEMY_DATABASE_URI = (
        f"postgresql+psycopg2://{DB_USER}:{DB_PASS}@{DB_HOST}:{DB_PORT}/{DB_NAME}"
    )
    SQLALCHEMY_TRACK_MODIFICATIONS = False

    # === Security ===
    SECRET_KEY = os.environ.get("SUPERSET_SECRET_KEY", "change-this-in-production")
    # Permite conexões a serviços internos K8s (ClusterIP) — necessário para Cube SQL API
    PREVENT_UNSAFE_DB_CONNECTIONS = False

    # === Redis ===
    REDIS_HOST = os.environ.get("REDIS_HOST", "localhost")
    REDIS_PORT = os.environ.get("REDIS_PORT", "6379")

    # === Celery ===
    class CeleryConfig:
        broker_url = f"redis://{REDIS_HOST}:{REDIS_PORT}/0"
        imports = ("superset.sql_lab",)
        result_backend = f"redis://{REDIS_HOST}:{REDIS_PORT}/1"
        worker_prefetch_multiplier = 1
        task_acks_late = False

    CELERY_CONFIG = CeleryConfig

    # === Cache ===
    CACHE_CONFIG = {
        "CACHE_TYPE": "RedisCache",
        "CACHE_DEFAULT_TIMEOUT": 86400,
        "CACHE_KEY_PREFIX": "superset_",
        "CACHE_REDIS_URL": f"redis://{REDIS_HOST}:{REDIS_PORT}/2",
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG
    RESULTS_BACKEND = RedisCache(
        host=REDIS_HOST,
        port=int(REDIS_PORT),
        key_prefix="superset_results",
    )

    # === Features ===
    FEATURE_FLAGS = {
        "ENABLE_TEMPLATE_PROCESSING": True,
    }

    MAPBOX_API_KEY = os.environ.get("MAPBOX_API_KEY", "")


    
  superset_init.sh: |
    #!/bin/sh
    set -eu
    echo "Upgrading DB schema..."
    superset db upgrade
    echo "Initializing roles..."
    superset init

    echo "Creating admin user..."
    superset fab create-admin \
        --username "$SUPERSET_ADMIN_USERNAME" \
        --firstname Superset \
        --lastname Admin \
        --email "${SUPERSET_ADMIN_EMAIL:-admin@nexusplatform.com.br}" \
        --password "$SUPERSET_ADMIN_PASSWORD" \
        || true

    echo "Registering Cube SQL API datasource..."
    python3 - <<'PYEOF' || echo "Warning: Cube datasource registration skipped"
    import os, sys
    try:
        from superset.app import create_app
        app = create_app()
        with app.app_context():
            from superset.extensions import db
            from superset.models.core import Database
            if not db.session.query(Database).filter_by(database_name="Cube SQL API").first():
                db.session.add(Database(
                    database_name="Cube SQL API",
                    sqlalchemy_uri="postgresql+psycopg2://cube:cube@cube-api.cube.svc.cluster.local:15432/cube_db",
                    expose_in_sqllab=True,
                    allow_run_async=True,
                    allow_ctas=False,
                    allow_cvas=False,
                    allow_dml=False,
                ))
                db.session.commit()
                print("Cube SQL API registered successfully")
            else:
                print("Cube SQL API already registered")
    except Exception as e:
        print(f"Skipped: {e}", file=sys.stderr)
        sys.exit(0)
    PYEOF

    echo "Done."
  superset_bootstrap.sh: |
    #!/bin/bash
    pip install --quiet psycopg2-binary redis && \
    if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid 0" > ~/bootstrap; fi
