apiVersion: v1
kind: Secret
metadata:
  name: superset-external-db-secret
  namespace: superset
type: Opaque
stringData:
  # Credenciais do PostgreSQL Externo
  DB_HOST: "url-do-seu-postgres-externo.com"
  DB_PORT: "5432"
  DB_NAME: "superset"
  DB_USER: "superset_admin"
  DB_PASS: "sua_senha_segura"
  
  # Credenciais de Administração do Superset
  SUPERSET_ADMIN_USERNAME: "admin"
  SUPERSET_ADMIN_PASSWORD: "admin_password"
  
  # Chave Secreta da Aplicação (Gere uma chave longa e aleatória, ex: openssl rand -base64 42)
  SUPERSET_SECRET_KEY: "SUA_CHAVE_SECRETA_MUITO_LONGA_AQUI"

  # Email do administrador (usado no superset_init.sh)
  SUPERSET_ADMIN_EMAIL: "admin@nexusplatform.com.br"