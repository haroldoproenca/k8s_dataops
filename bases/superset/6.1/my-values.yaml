# Define the namespace where Superset will be installed
namespace: superset

configOverrides:
  superset_config: |
    import os

    # 1. Configuração do Banco de Dados Principal
    DB_USER = os.environ.get("DB_USER")
    DB_PASS = os.environ.get("DB_PASS")
    DB_HOST = os.environ.get("DB_HOST")
    DB_PORT = os.environ.get("DB_PORT", "5432")
    DB_NAME = os.environ.get("DB_NAME")
    
    SQLALCHEMY_DATABASE_URI = f"postgresql+psycopg2://{DB_USER}:{DB_PASS}@{DB_HOST}:{DB_PORT}/{DB_NAME}"

    # 2. Configuração da Chave Secreta
    SECRET_KEY = os.environ.get("SUPERSET_SECRET_KEY")

    # 3. Configuração do Redis / Celery
    REDIS_HOST = os.environ.get("REDIS_HOST")
    REDIS_PORT = os.environ.get("REDIS_PORT", "6379")
    
    class CeleryConfig(object):
        broker_url = f"redis://{REDIS_HOST}:{REDIS_PORT}/0"
        imports = ("superset.sql_lab", )
        result_backend = f"redis://{REDIS_HOST}:{REDIS_PORT}/1"
        worker_prefetch_multiplier = 1
        task_acks_late = False

    CELERY_CONFIG = CeleryConfig
    
    CACHE_CONFIG = {
        'CACHE_TYPE': 'RedisCache',
        'CACHE_DEFAULT_TIMEOUT': 86400,
        'CACHE_KEY_PREFIX': 'superset_',
        'CACHE_REDIS_URL': f"redis://{REDIS_HOST}:{REDIS_PORT}/2"
    }
    
    DATA_CACHE_CONFIG = CACHE_CONFIG

bootstrapScript: |
  #!/bin/bash
  pip install psycopg2 pyhive redis && \
  if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap; fi

# -- Specify rather or not helm should create the secret described in `secret-env.yaml` template
secretEnv:
  create: false

# -- Specify service account name to be used
serviceAccountName: superset-sa
serviceAccount:
  create: true
  annotations:
    # Mantenha se precisar de acesso a S3 ou outros recursos AWS, senão pode remover
    eks.amazonaws.com/role-arn: <your_IRSA_role_arn>

envFromSecret: '{{ template "superset.fullname" . }}-config'

# -- Extra environment variables that will be passed into pods
extraEnv:
  REDIS_HOST: "<your_redis_db_endpoint>"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  REDIS_CELERY_DB: "0"
  REDIS_PROTO: "redis"
  SUPERSET_LOG_LEVEL: "info"
  SUPERSET_CONFIG_PATH: /app/superset_config.py

# -- Extra environment variables in RAW format that will be passed into pods
extraEnvRaw:
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: DB_PASS
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: DB_USER
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: DB_HOST
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: DB_PORT
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: DB_NAME
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: SUPERSET_SECRET_KEY
  - name: SUPERSET_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: SUPERSET_ADMIN_USERNAME
  - name: SUPERSET_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: superset-external-db-secret
        key: SUPERSET_ADMIN_PASSWORD

image:
  repository: <your_ecr_url>
  tag: <your_image_tag>
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  path: /
  pathType: ImplementationSpecific
  hosts:
    - <your_host>
  tls: []
  extraHostsRaw: []

# Superset node configuration
supersetNode:
  replicas:
    enabled: true
    replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 60
  
  initContainers:
    - name: wait-for-postgres
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: superset-external-db-secret
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: DB_PORT
              name: superset-external-db-secret
      envFrom:
        - secretRef:
            name: "{{ tpl .Values.envFromSecret . }}"
      command:
        - /bin/sh
        - -c
        - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s

# Superset Celery worker configuration
supersetWorker:
  replicas:
    enabled: true
    replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 60
  
  initContainers:
    - name: wait-for-postgres-redis
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: superset-external-db-secret
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: DB_PORT
              name: superset-external-db-secret
        - name: REDIS_HOST
          value: "{{ tpl .Values.extraEnv.REDIS_HOST . }}"
        - name: REDIS_PORT
          value: "{{ tpl .Values.extraEnv.REDIS_PORT . }}"
      envFrom:
        - secretRef:
            name: "{{ tpl .Values.envFromSecret . }}"
      command:
        - /bin/sh
        - -c
        - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -wait "tcp://$REDIS_HOST:$REDIS_PORT" -timeout 120s

# Superset beat configuration
supersetCeleryBeat:
  enabled: true
  initContainers:
    - name: wait-for-postgres-redis
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: superset-external-db-secret
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: DB_PORT
              name: superset-external-db-secret
        - name: REDIS_HOST
          value: "{{ tpl .Values.extraEnv.REDIS_HOST . }}"
        - name: REDIS_PORT
          value: "{{ tpl .Values.extraEnv.REDIS_PORT . }}"
      envFrom:
        - secretRef:
            name: "{{ tpl .Values.envFromSecret . }}"
      command:
        - /bin/sh
        - -c
        - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -wait "tcp://$REDIS_HOST:$REDIS_PORT" -timeout 120s

init:
  loadExamples: false
  createAdmin: true
  adminUser:
    username: $SUPERSET_ADMIN_USERNAME
    firstname: Superset
    lastname: Admin
    email: <admin_email>
    password: $SUPERSET_ADMIN_PASSWORD
  
  initContainers:
    - name: wait-for-postgres
      image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
      imagePullPolicy: "{{ .Values.initImage.pullPolicy }}"
      env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: superset-external-db-secret
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: DB_PORT
              name: superset-external-db-secret
      envFrom:
        - secretRef:
            name: "{{ tpl .Values.envFromSecret . }}"
      command:
        - /bin/sh
        - -c
        - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -timeout 120s

postgresql:
  enabled: false

redis:
  enabled: false
