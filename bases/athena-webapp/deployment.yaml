apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-webapp-deployment
  labels:
    app: athena-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athena-webapp
  template:
    metadata:
      labels:
        app: athena-webapp
    spec:
      containers:
      - name: athena-webapp-container
        image: ghcr.io/haroldoproenca/athena-webapp:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - >-
          echo "window.__ATHENA_ENV__ = { API_BASE_URL: '${API_BASE_URL}' };" > /usr/share/nginx/html/env.js &&
          nginx -g 'daemon off;'
        env:
        - name: API_BASE_URL
          value: "http://localhost:8000"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: nginx-config-volume
        configMap:
          name: athena-webapp-nginx-conf
