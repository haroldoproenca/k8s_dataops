apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-web
  namespace: marquez
  labels:
    app.kubernetes.io/name: marquez
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marquez
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marquez
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: marquez-web
          image: docker.io/marquezproject/marquez-web:0.51.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: MARQUEZ_HOST
              value: "marquez"
            - name: MARQUEZ_PORT
              value: "80"
            - name: WEB_PORT
              value: "3000"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
