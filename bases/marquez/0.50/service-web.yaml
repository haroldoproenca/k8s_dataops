apiVersion: v1
kind: Service
metadata:
  name: marquez-web
  namespace: marquez
  labels:
    app.kubernetes.io/name: marquez
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: marquez
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
