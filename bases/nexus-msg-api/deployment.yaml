apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-msg-api-deployment
  labels:
    app: nexus-msg-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-msg-api
  template:
    metadata:
      labels:
        app: nexus-msg-api
    spec:
      containers:
      - name: nexus-msg-api-container
        image: ghcr.io/synapsehealthtech/nexus-msg-api:v0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: nexus-msg-api-config
        - secretRef:
            name: nexus-msg-api-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

