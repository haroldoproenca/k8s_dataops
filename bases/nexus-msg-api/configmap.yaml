apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-msg-api-config
data:
  PROJECT_NAME: "Nexus Messaging Gateway"
  META_GRAPH_API_VERSION: "v23.0"
  WHATSAPP_WEBHOOK_PUBLIC_URL: "https://msg-api.tech.nexusplatform.com.br/api/v1/whatsapp/webhook"
  CORS_ORIGINS: "https://msg.tech.nexusplatform.com.br"
  TENANT_FORWARD_TIMEOUT_SECONDS: "10"
  TENANT_FORWARD_ALLOWED_HOSTS: ".nexusplatform.com.br"
  WEBHOOK_MAX_BODY_BYTES: "1048576"
  WEBHOOK_MAX_ATTEMPTS: "8"
  WEBHOOK_RETRY_BASE_SECONDS: "5"
  WEBHOOK_RETRY_MAX_SECONDS: "3600"
  WEBHOOK_LEASE_SECONDS: "60"
  WORKER_POLL_SECONDS: "1"
  SEND_LEGACY_GATEWAY_TOKEN: "false"
  WHATSAPP_TEST_PHONE_NUMBER: ""
  WHATSAPP_TEST_PHONE_NUMBER_ID: ""
  WHATSAPP_TEST_WABA_ID: ""
