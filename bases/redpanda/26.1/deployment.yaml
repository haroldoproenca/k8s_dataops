---
# Source: operator/templates/entry-point.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: null
  labels:
    app.kubernetes.io/instance: redpanda-controller
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: operator
    app.kubernetes.io/version: v26.1.3
    helm.sh/chart: operator-26.1.3
  name: redpanda-controller-operator
  namespace: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: redpanda-controller
      app.kubernetes.io/name: operator
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/instance: redpanda-controller
        app.kubernetes.io/name: operator
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --configurator-base-image=docker.redpanda.com/redpandadata/redpanda-operator
        - --configurator-tag=v26.1.3
        - --enable-console=true
        - --enable-vectorized-controllers=false
        - --health-probe-bind-address=:8081
        - --leader-elect
        - --log-level=info
        - --metrics-bind-address=:8443
        - --webhook-enabled=false
        command:
        - /manager
        env: []
        image: docker.redpanda.com/redpandadata/redpanda-operator:v26.1.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz/
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
      ephemeralContainers: null
      imagePullSecrets: []
      initContainers: []
      nodeSelector: {}
      securityContext:
        runAsUser: 65532
      serviceAccountName: redpanda-controller-operator
      terminationGracePeriodSeconds: 10
      tolerations: []
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace