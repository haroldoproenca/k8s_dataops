apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    helm.sh/hook-weight: "-5"
  labels:
    app.kubernetes.io/instance: redpanda-controller
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: operator
    app.kubernetes.io/version: v26.1.3
    helm.sh/chart: operator-26.1.3
  name: redpanda-controller-operator-crds
  namespace: redpanda
spec:
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/instance: redpanda-controller
        app.kubernetes.io/name: operator
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - crd
        command:
        - /redpanda-operator
        image: docker.redpanda.com/redpandadata/redpanda-operator:v26.1.3
        imagePullPolicy: IfNotPresent
        name: crd-installation
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
      imagePullSecrets: []
      nodeSelector: {}
      restartPolicy: OnFailure
      serviceAccountName: redpanda-controller-operator-crd-job
      terminationGracePeriodSeconds: 10
      tolerations: []
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
