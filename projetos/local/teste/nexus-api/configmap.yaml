apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-api-config
data:
  CORS_ORIGINS: "https://teste.nexusplatform.com.br,https://teste-api.nexusplatform.com.br,http://localhost:5173"
  NEXUS_CEP_URL: "http://nexus-cep-service.nexus-cep.svc.cluster.local:80"
  # Habilite somente depois de gravar no Secret a API key emitida pelo motor.
  NEXUS_CAMPAIGN_ENABLED: "false"
  NEXUS_CAMPAIGN_API_URL: "http://nexus-campaign-api-service.nexus-local.svc.cluster.local"
  NEXUS_CAMPAIGN_TIMEOUT_SECONDS: "15"
  NEXUS_CAMPAIGN_DEFAULT_PHONE_COUNTRY_CODE: "55"
  SMTP_HOST: "smtp.email.sa-saopaulo-1.oci.oraclecloud.com"
  SMTP_PORT: "587"
  EMAILS_FROM_EMAIL: "noreply@nexusplatform.com.br"
  EMAILS_FROM_NAME: "Nexus Platform"
  NEXUS_CI_TOKEN: "teste-playwright"
  # Meta / WhatsApp Cloud API — preencher com o App ID e o Configuration ID
  # do Embedded Signup criados em developers.facebook.com (app tipo Business).
  # Enquanto META_APP_ID estiver vazio, o wizard mostra "Integração Meta não
  # configurada" (503 proposital) e só o modo manual (System User Token) funciona.
  META_APP_ID: ""
  META_EMBEDDED_SIGNUP_CONFIG_ID: ""
  META_GRAPH_API_VERSION: "v23.0"


