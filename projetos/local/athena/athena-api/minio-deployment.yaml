apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-minio-deployment
  labels:
    app: athena-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athena-minio
  template:
    metadata:
      labels:
        app: athena-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: athena-api-secrets
                  key: ATHENA_STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: athena-api-secrets
                  key: ATHENA_STORAGE_SECRET_KEY
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: athena-minio-pvc
