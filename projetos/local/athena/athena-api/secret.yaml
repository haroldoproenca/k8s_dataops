apiVersion: v1
kind: Secret
metadata:
  name: athena-api-secrets
type: Opaque
stringData:
  # Postgres de metadata/relacional roda no Ubuntu local na porta 5432.
  # Dentro do K3D, localhost do host é acessado via host.k3d.internal.
  ATHENA_DATABASE_URL: postgresql+asyncpg://athena_app:athena@host.k3d.internal:5432/athena
  ATHENA_JWT_SECRET: athena-local-dev-secret-change-me-32
  ATHENA_STORAGE_ACCESS_KEY: athena
  ATHENA_STORAGE_SECRET_KEY: athena123
