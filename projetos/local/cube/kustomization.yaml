apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cube

resources:
  - ../../../bases/cube
  - httproute.yaml
  - cube-schema-configmap.yaml
  # certificate e reference-grant omitidos: Gateway já tem wildcard-tech-tls-secret
  # cobrindo *.tech.nexusplatform.com.br no listener tech-https

patches:
  - path: configmap.yaml
  - path: secret.yaml
  - path: cube-api-deployment.yaml
  - path: cube-refresh-worker-deployment.yaml
  - path: cubestore-router-deployment.yaml
  - path: cubestore-worker-statefulset.yaml
  - path: cubeapi-pvc.yaml
  - path: cubestore-pvc.yaml
