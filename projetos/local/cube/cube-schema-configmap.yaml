apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-schema
data:
  # Schema mínimo para RisingWave — impede auto-geração que bloqueia o event loop
  # Cube lê este arquivo de /cube/conf/risingwave.yml
  # Expanda com as Materialized Views reais do RisingWave (mv_faturamento_mensal, etc.)
  risingwave.yml: |
    cubes:
      - name: RisingWaveInfo
        sql: >
          SELECT
            'risingwave' AS source,
            current_timestamp AS checked_at
        dimensions:
          - name: source
            sql: source
            type: string
            primary_key: true
          - name: checked_at
            sql: checked_at
            type: time
        measures:
          - name: count
            type: count
