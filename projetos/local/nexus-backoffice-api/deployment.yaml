# Strategic merge patch — K3D local
# Imagem importada: k3d image import nexus-backoffice-api:latest -c k8s-dataops
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-backoffice-api-deployment
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: nexus-backoffice-api-container
        image: nexus-backoffice-api:latest
        imagePullPolicy: Never
        # resources: OMITIDO INTENCIONALMENTE — K3D local não usa resources
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
