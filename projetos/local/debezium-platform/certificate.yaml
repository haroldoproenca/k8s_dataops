apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: debezium-platform-tech-tls
  namespace: debezium-platform
spec:
  secretName: debezium-platform-tech-tls-secret
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: tech.nexusplatform.com.br
  dnsNames:
    - tech.nexusplatform.com.br
    - "*.tech.nexusplatform.com.br"
