apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-proxy-config
  namespace: debezium-platform
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }

    http {
      # Domínio principal: stage + API via same-origin (/api/* → conductor)
      server {
        listen 80;
        server_name _;

        auth_basic "Nexus Platform";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location /api/ {
          proxy_pass http://conductor.debezium-platform.svc.cluster.local:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
          proxy_pass http://stage.debezium-platform.svc.cluster.local:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }

      # Domínio direto da API (acesso externo com credenciais)
      server {
        listen 8081;
        server_name _;

        auth_basic "Nexus Platform";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
          proxy_pass http://conductor.debezium-platform.svc.cluster.local:8080;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
