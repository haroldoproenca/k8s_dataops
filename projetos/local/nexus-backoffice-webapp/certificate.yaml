apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nexus-backoffice-webapp-tls
  namespace: nexus-backoffice-webapp
spec:
  secretName: nexus-backoffice-webapp-tls-secret
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: tech.nexusplatform.com.br
  dnsNames:
  - tech.nexusplatform.com.br
  - "*.tech.nexusplatform.com.br"
