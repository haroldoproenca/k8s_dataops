# Strategic merge patch — K3D local
# Imagem importada: k3d image import nexus-backoffice-webapp:latest -c k8s-dataops
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-backoffice-webapp-deployment
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: nexus-backoffice-webapp-container
        image: nexus-backoffice-webapp:latest
        imagePullPolicy: Never
        # resources: OMITIDO INTENCIONALMENTE — K3D local não usa resources
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
