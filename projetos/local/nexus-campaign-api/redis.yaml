apiVersion: v1
kind: Service
metadata:
  name: nexus-campaign-redis
spec:
  selector:
    app: nexus-campaign-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-campaign-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-campaign-redis
  template:
    metadata:
      labels:
        app: nexus-campaign-redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args: ["redis-server", "--appendonly", "yes"]
        ports:
        - name: redis
          containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        emptyDir: {}
