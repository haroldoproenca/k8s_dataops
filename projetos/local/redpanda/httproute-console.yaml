apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redpanda-console-route
  namespace: redpanda
spec:
  parentRefs:
    - name: nexus-gateway
      namespace: nginx-gateway
      sectionName: tech-https
  hostnames:
    - "redpanda-console.tech.nexusplatform.com.br"
  rules:
    # WebSocket — Redpanda Console usa WS para atualizações em tempo real
    - matches:
        - path:
            type: PathPrefix
            value: /
          headers:
            - type: Exact
              name: Upgrade
              value: websocket
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: redpanda-console
          port: 8080
    # HTTP padrão
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 60s
        backendRequest: 60s
      backendRefs:
        - name: redpanda-console
          port: 8080
