# Patch para o Job de inicialização (superset db upgrade + create-admin)
# Roda uma vez na instalação; re-execute com: kubectl delete job superset-init-db -n superset
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init-db
  namespace: superset
spec:
  template:
    spec:
      containers:
      - name: superset-init-db
        image: apache/superset:4.1.3
        env:
        - name: SUPERSET_CONFIG_PATH
          value: /app/pythonpath/superset_config.py
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
