# Patch para superset-external-db-secret — ambiente local (k3d)
# PostgreSQL roda no Ubuntu host, acessível via host.k3d.internal
# Antes do primeiro deploy: createdb superset && createuser superset
apiVersion: v1
kind: Secret
metadata:
  name: superset-external-db-secret
  namespace: superset
type: Opaque
stringData:
  DB_HOST: "host.k3d.internal"
  DB_PORT: "5432"
  DB_NAME: "superset"
  DB_USER: "superset"
  DB_PASS: "superset"
  SUPERSET_ADMIN_USERNAME: "admin"
  SUPERSET_ADMIN_PASSWORD: "admin"
  SUPERSET_ADMIN_EMAIL: "admin@nexusplatform.com.br"
  SUPERSET_SECRET_KEY: "local-dev-secret-key-change-in-production"
