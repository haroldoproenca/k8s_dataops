# Patch para o Celery Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-worker
  namespace: superset
spec:
  replicas: 1
  template:
    spec:
      initContainers:
      - name: wait-for-postgres-redis
        env:
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
      containers:
      - name: superset
        image: apache/superset:4.1.3
        # --concurrency=1 evita fork excessivo de processos em K3D (OOMKill)
        command:
        - /bin/sh
        - -c
        - ". /app/pythonpath/superset_bootstrap.sh; celery --app=superset.tasks.celery_app:app worker --concurrency=1"
        env:
        - name: SUPERSET_CONFIG_PATH
          value: /app/pythonpath/superset_config.py
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
