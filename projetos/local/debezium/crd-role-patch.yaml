# Patch k3d: permite ao operador criar/atualizar o CRD debeziumservers.debezium.io
# em produção o ClusterRole só tem get/list — aqui adicionamos write para auto-install
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: debezium-operator-crd-validating-cluster-role
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - create
      - patch
      - update
