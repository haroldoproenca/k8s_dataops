# KEDA ScaledObject para ARQ Worker — escala baseado na fila Redis, não em CPU.
#
# ARQ armazena jobs em sorted set (ZADD), não em lista (RPUSH).
# Por isso: keyName + zsetLength (não listName + listLength).
#
# Requer KEDA instalado no cluster:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda -n keda --create-namespace
#
# ATENÇÃO: Se há HPA (hpa.yaml na base) apontando para o mesmo Deployment,
# remova-o antes de aplicar este ScaledObject — KEDA cria seu próprio HPA
# internamente e os dois colidem.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: arq-worker-scaler
  namespace: nexus-agenticops
spec:
  scaleTargetRef:
    name: nexus-agenticops-worker-deployment
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 60        # aguarda 60s antes de scale down
  triggers:
    - type: redis
      metadata:
        address: redis-service:6379
        keyName: arq:queue:default       # sorted set da fila ARQ
        zsetLength: "5"                   # 1 worker adicional a cada 5 jobs pendentes
        activationZsetLength: "1"         # ativa scaling a partir de 1 job
        databaseIndex: "0"
      authenticationRef:
        name: redis-trigger-auth
