apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-agenticops

resources:
  - ../../../bases/nexus-agenticops-api
  - httproute-api.yaml
  - httproute-langfuse.yaml
  - httproute-litellm.yaml
  - certificate-api.yaml
  - certificate-langfuse.yaml
  - certificate-litellm.yaml
  - reference-grant.yaml

patches:
  - path: configmap.yaml
  - path: litellm-configmap.yaml
  - path: secret.yaml
  - path: agents-api-deployment.yaml
  - path: arq-worker-deployment.yaml
