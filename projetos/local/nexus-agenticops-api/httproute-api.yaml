apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents-api-route
  namespace: nexus-agenticops
spec:
  parentRefs:
    - name: nexus-gateway
      namespace: nginx-gateway
      sectionName: tech-https
  hostnames:
    - "hark-api.tech.nexusplatform.com.br"
  rules:
    # CORS preflight — OPTIONS /flows/parse/stream deve chegar ao FastAPI antes da regra SSE.
    # NGINX Gateway Fabric não faz fall-through: o header match da regra SSE causa 404 para OPTIONS.
    - matches:
        - path:
            type: PathPrefix
            value: /flows/parse/stream
          method: OPTIONS
      backendRefs:
        - name: nexus-agenticops-api-service
          port: 80
    # SSE via POST — webapp usa fetch()+ReadableStream com accept:*/*, não EventSource.
    # Match por method:POST garante timeout infinito sem depender do Accept header.
    - matches:
        - path:
            type: PathPrefix
            value: /flows/parse/stream
          method: POST
      backendRefs:
        - name: nexus-agenticops-api-service
          port: 80
    # Regra geral — endpoints HTTP normais (inclui SSE: NGINX GF não suporta timeouts)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nexus-agenticops-api-service
          port: 80
