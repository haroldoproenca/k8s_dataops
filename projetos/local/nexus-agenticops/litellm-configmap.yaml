# Strategic merge patch — LiteLLM config para K3d local com Ollama no host.
#
# Ollama roda no HOST da máquina (acesso à GPU/Metal).
# K3d acessa via host.k3d.internal (alias automático do K3d para o endereço do host).
#
# Antes de aplicar:
#   ollama serve                  # inicia no host, porta 11434
#   ollama pull llama3.2          # modelo padrão (~2GB)
#   ollama pull llama3.2:3b       # modelo roteador/rápido (~1.8GB)
#   ollama pull llama3.1:8b       # modelo premium (~4.7GB)
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: agente-padrao
        litellm_params:
          model: ollama/llama3.2
          api_base: "http://host.k3d.internal:11434"
          rpm: 1000
          timeout: 120

      - model_name: agente-rapido
        litellm_params:
          model: ollama/llama3.2:3b
          api_base: "http://host.k3d.internal:11434"
          rpm: 2000
          timeout: 60

      - model_name: agente-premium
        litellm_params:
          model: ollama/llama3.1:8b
          api_base: "http://host.k3d.internal:11434"
          rpm: 500
          timeout: 180

      # Orquestrador Mentor (Tier 1) e bouncer (Tier 0.5) — necessários pelo agente Mentor.
      - model_name: agente-mentor
        litellm_params:
          model: ollama/llama3.2
          api_base: "http://host.k3d.internal:11434"
          rpm: 1000
          timeout: 120

      - model_name: agente-gateway
        litellm_params:
          model: ollama/llama3.2:3b
          api_base: "http://host.k3d.internal:11434"
          rpm: 2000
          timeout: 60

      # Embedding do cache semântico de turno e do VectorStore (model="text-embedding-3-small").
      # OpenAI = 1536 dims, casa com a coluna pgvector vector(1536). O `api_key` aqui é um
      # PLACEHDER literal (NÃO é segredo): existe só p/ o deployment subir healthy. A
      # credencial OpenAI REAL vem do BANCO (providers) por requisição (extra_body em
      # semantic_cache._embed) e sobrescreve este placeholder — política: chave de provider
      # de agente nunca fica no secret.
      - model_name: text-embedding-3-small
        litellm_params:
          model: openai/text-embedding-3-small
          api_key: "db-injected-per-request"
          rpm: 3000
          timeout: 30

      # Passthrough por provider p/ modelos escolhidos por nó na UI (/admin/models).
      # api_key = PLACEHOLDER literal (deployment healthy); a credencial REAL vem do BANCO
      # em runtime (model_resolver → extra_body) e sobrescreve. Nunca do secret. Adicionar
      # provider novo = um wildcard aqui. (gemini/gemini-3.5-flash cai em gemini/* )
      - model_name: "gemini/*"
        litellm_params:
          model: "gemini/*"
          api_key: "db-injected-per-request"
      - model_name: "openai/*"
        litellm_params:
          model: "openai/*"
          api_key: "db-injected-per-request"
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"
          api_key: "db-injected-per-request"
      - model_name: "deepseek/*"
        litellm_params:
          model: "deepseek/*"
          api_key: "db-injected-per-request"

    router_settings:
      # "lowest_cost" foi removido do LiteLLM (erro: Invalid routing_strategy) — usar
      # "simple-shuffle". Como cada model group tem 1 só deployment, a estratégia é inócua.
      routing_strategy: "simple-shuffle"
      num_retries: 1
      fallbacks: []

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      cache: true
      cache_params:
        type: "redis-semantic"
        similarity_threshold: 0.95
        host: "redis-service"
        port: 6379
        password: "os.environ/REDIS_PASSWORD"
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]

    environment_variables:
      LANGFUSE_PUBLIC_KEY: "os.environ/LANGFUSE_PUBLIC_KEY"
      LANGFUSE_SECRET_KEY: "os.environ/LANGFUSE_SECRET_KEY"
      LANGFUSE_HOST: "https://agenticops-langfuse.nexusplatform.com.br"
