apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents-api-route
  namespace: nexus-agenticops
spec:
  parentRefs:
    - name: nexus-gateway
      namespace: nginx-gateway
      # hosts .tech.nexusplatform.com.br atam no listener tech-https (cert wildcard-tech-tls-secret).
      # "https" serve *.nexusplatform.com.br → cert com CN inválido p/ *.tech (ERR_CERT_COMMON_NAME_INVALID).
      sectionName: tech-https
  hostnames:
    - "hark-api.tech.nexusplatform.com.br"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nexus-agenticops-api-service
          port: 80
