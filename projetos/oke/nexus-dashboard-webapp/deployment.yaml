apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-dashboard-webapp
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: nexus-dashboard-webapp
        image: ghcr.io/synapsehealthtech/nexus-dashboard-webapp:latest
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
