apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-campaign-api
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: nexus-campaign-api
        image: ghcr.io/synapsehealthtech/nexus-campaign-api:v1.0.0
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      - name: nexus-campaign-worker
        image: ghcr.io/synapsehealthtech/nexus-campaign-api:v1.0.0
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          exec:
            command: ["python", "-c", "import os; os.kill(1, 0)"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["python", "-c", "import os; os.kill(1, 0)"]
          initialDelaySeconds: 20
          periodSeconds: 20
