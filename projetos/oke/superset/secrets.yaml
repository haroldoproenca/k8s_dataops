# Patch para superset-external-db-secret — ambiente OKE (Oracle Cloud)
# PostgreSQL roda fora do cluster OKE (serviço externo ou DBaaS)
# Use o IP privado ou hostname do seu PostgreSQL acessível do cluster
# Gere uma secret key forte: openssl rand -base64 42
apiVersion: v1
kind: Secret
metadata:
  name: superset-external-db-secret
  namespace: superset
type: Opaque
stringData:
  DB_HOST: "SUBSTITUA_PELO_IP_DO_POSTGRES_EXTERNO"
  DB_PORT: "5432"
  DB_NAME: "superset"
  DB_USER: "superset"
  DB_PASS: "SUBSTITUA_PELA_SENHA_DO_POSTGRES"
  SUPERSET_ADMIN_USERNAME: "admin"
  SUPERSET_ADMIN_PASSWORD: "SUBSTITUA_PELA_SENHA_ADMIN"
  SUPERSET_ADMIN_EMAIL: "admin@nexusplatform.com.br"
  SUPERSET_SECRET_KEY: "SUBSTITUA_POR_CHAVE_ALEATORIA_openssl_rand_base64_42"
