apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus-dashboard-api-route
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dashboard-api.nexusplatform.com.br
    nginx.org/cors-allow-origin: "https://dashboard.nexusplatform.com.br"
    nginx.org/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.org/cors-allow-headers: "Content-Type, Authorization, X-Requested-With"
    nginx.org/cors-allow-credentials: "true"
spec:
  parentRefs:
  - name: nexus-gateway
    namespace: nginx-gateway
    sectionName: https
  hostnames:
  - "dashboard-api.nexusplatform.com.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nexus-dashboard-api-service
      port: 80
