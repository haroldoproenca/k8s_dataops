apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cube

resources:
  - ../../../bases/cube
  - httproute.yaml
  - certificate.yaml
  - reference-grant.yaml

patches:
  - path: configmap.yaml
  - path: secret.yaml
  - path: cube-api-deployment.yaml
  - path: cube-refresh-worker-deployment.yaml
  - path: cubestore-router-deployment.yaml
  - path: cubestore-worker-statefulset.yaml
  # ReadWriteMany para múltiplos nós OKE (oci-fss)
  - path: cubeapi-pvc.yaml
  - path: cubestore-pvc.yaml
