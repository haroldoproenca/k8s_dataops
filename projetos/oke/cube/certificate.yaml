apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cube-tls
  namespace: cube
spec:
  secretName: cube-tls-secret
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: nexusplatform.com.br
  dnsNames:
    - nexusplatform.com.br
    - "*.nexusplatform.com.br"
