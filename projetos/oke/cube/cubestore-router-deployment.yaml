# Strategic merge patch — OKE produção (ARM64, image arm64v8, resources de produção)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubestore-router
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: cubestore-router
          # arm64v8 obrigatório — workers OKE são ARM64
          image: cubejs/cubestore:arm64v8
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
