# Strategic merge patch — OKE usa oci-fss (ReadWriteMany) para compartilhar
# /cube/data entre cubestore-router e cubestore-workers em nós distintos
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cubestore-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: oci-fss
  resources:
    requests:
      storage: 50Gi
