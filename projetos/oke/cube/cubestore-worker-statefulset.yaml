# Strategic merge patch — OKE produção (ARM64, 2 workers, resources de produção)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cubestore-worker
spec:
  replicas: 2
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: cubestore-worker
          # arm64v8 obrigatório — workers OKE são ARM64
          image: cubejs/cubestore:arm64v8
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
